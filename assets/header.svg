<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#140b24" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="circuitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    @keyframes circuitNodeGlow {
      0%, 100% { fill: #00f0ff; r: 3; }
      50% { fill: #ff007a; r: 5; filter: drop-shadow(0 0 6px #ff007a); }
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 0.6;
      opacity: 0.4;
    }
    .circuit-path {
      stroke: url(#circuitGlow);
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 6 4;
      animation: dashMove 15s linear infinite;
    }
    .circuit-accent {
      stroke: #00f0ff;
      stroke-width: 2;
      fill: none;
      filter: url(#glow);
    }
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 40px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .title-highlight {
      fill: url(#cyanPurple);
      filter: url(#glow);
    }
    .subtitle-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 15px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.8px;
    }
    .tag-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge-bg {
      rx: 6px;
      ry: 6px;
    }
  </style>

  <!-- Background Base with Rounded Corners -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Digital Grid Pattern -->
  <g opacity="0.35">
    <line x1="0" y1="40" x2="900" y2="40" class="grid-line" />
    <line x1="0" y1="80" x2="900" y2="80" class="grid-line" />
    <line x1="0" y1="120" x2="900" y2="120" class="grid-line" />
    <line x1="0" y1="160" x2="900" y2="160" class="grid-line" />
    <line x1="0" y1="200" x2="900" y2="200" class="grid-line" />
    <line x1="100" y1="0" x2="100" y2="240" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="240" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="240" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="240" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="240" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="240" class="grid-line" />
  </g>

  <!-- Animated Hardware / Circuit Traces on Left & Right -->
  <g class="circuit-path">
    <!-- Left Circuit Lines -->
    <path d="M 0,60 L 60,60 L 90,90 L 90,150 L 50,190 L 0,190" />
    <path d="M 30,0 L 30,40 L 70,80 L 140,80" />
    <path d="M 0,120 L 50,120 L 70,140 L 120,140" />

    <!-- Right Circuit Lines -->
    <path d="M 900,60 L 840,60 L 810,90 L 810,150 L 850,190 L 900,190" />
    <path d="M 870,0 L 870,40 L 830,80 L 760,80" />
    <path d="M 900,120 L 850,120 L 830,140 L 780,140" />
  </g>

  <!-- Glowing Accent Lines -->
  <path d="M 140,80 L 170,80 L 190,100" class="circuit-accent" />
  <path d="M 760,80 L 730,80 L 710,100" class="circuit-accent" />

  <!-- Animated Circuit Nodes -->
  <circle cx="190" cy="100" r="4" fill="#00f0ff" style="animation: circuitNodeGlow 3s ease-in-out infinite;" />
  <circle cx="120" cy="140" r="3" fill="#00f0ff" />
  <circle cx="90" cy="90" r="3" fill="#a855f7" />
  <circle cx="710" cy="100" r="4" fill="#00f0ff" style="animation: circuitNodeGlow 3s ease-in-out infinite 1.5s;" />
  <circle cx="780" cy="140" r="3" fill="#00f0ff" />
  <circle cx="810" cy="90" r="3" fill="#a855f7" />

  <!-- Top Accent Glowing Border Beam -->
  <line x1="80" y1="0" x2="820" y2="0" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glow)" />

  <!-- Central Content Area -->
  <!-- Top Category Chip -->
  <g transform="translate(355, 30)">
    <rect width="190" height="24" class="badge-bg" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#00f0ff" filter="url(#glow)" />
    <text x="26" y="16" fill="#00f0ff" class="tag-text">HARDWARE &amp; SOFTWARE</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(450, 108)" text-anchor="middle">
    <text class="title-text">
      Hi, I'm <tspan class="title-highlight">Divyansh</tspan> 👋
    </text>
  </g>

  <!-- Subtitle with Hardware & Software Synergy -->
  <g transform="translate(450, 148)" text-anchor="middle">
    <text class="subtitle-text">
      <tspan fill="#38bdf8">&lt;</tspan>Electronics &amp; Communication Engineering<tspan fill="#38bdf8"> /&gt;</tspan>
    </text>
  </g>

  <!-- Tech Focus Pills -->
  <g transform="translate(450, 192)" text-anchor="middle">
    <!-- Embedded & Robotics -->
    <g transform="translate(-180, 0)">
      <rect x="-100" y="-14" width="195" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="-2" y="3" fill="#c7d2fe" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🤖 Embedded &amp; Robotics</text>
    </g>

    <!-- AI & Computer Vision -->
    <g transform="translate(0, 0)">
      <rect x="-90" y="-14" width="180" height="26" rx="13" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1" />
      <text x="0" y="3" fill="#bae6fd" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🔬 Real-Time CV &amp; AI</text>
    </g>

    <!-- Systems & Full-Stack -->
    <g transform="translate(180, 0)">
      <rect x="-95" y="-14" width="190" height="26" rx="13" fill="#3b0764" stroke="#a855f7" stroke-width="1" />
      <text x="0" y="3" fill="#f5d0fe" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">⚡ High-Speed Systems</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="200" y1="240" x2="700" y2="240" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.6" filter="url(#glow)" />
</svg>
