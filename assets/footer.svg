<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff007a" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glowFooter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-20px); }
      100% { transform: translateX(0); }
    }
    .wave-path {
      animation: waveMove 8s ease-in-out infinite;
    }
  </style>

  <!-- Ambient Bottom Glow -->
  <path d="M 0,30 Q 225,5 450,30 T 900,30 L 900,80 L 0,80 Z" fill="#0d1117" opacity="0.9" />
  <path d="M 0,40 Q 225,15 450,40 T 900,40" stroke="url(#footerGrad)" stroke-width="2.5" fill="none" class="wave-path" filter="url(#glowFooter)" />
  <path d="M 0,55 Q 225,35 450,55 T 900,55" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" fill="none" />
</svg>
